<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego Cazando</title>
  <link rel="styleSheet" href="cazando.css"/>
  <script src="utils.js"></script>
</head>
<body onload="iniciarJuego();">

  <h1>Juego Cazando</h1>
  <p>Autor: Kevin Vera</p>
  <canvas id="areaJuego" width="500" height="500"></canvas>

  <div class="controles">
    <button class="flecha flecha-arriba" onclick="moverArriba();">⬆</button>
    <br>
    <button class="flecha flecha-izquierda" onclick="moverIzquierda();">⬅</button>
    <button class="flecha flecha-abajo" onclick="moverAbajo();">⬇</button>
    <button class="flecha flecha-derecha" onclick="moverDerecha();">➡</button>
    <p><button class="boton" onclick="reiniciar();">REINICIAR</button></p>
  </div>


  <div class="panel">
    <span>Puntos: <span id="puntos">0</span></span>
    <span>Tiempo: <span id="tiempo">10</span></span>
  </div>

  <p id="mensaje"></p>

  <script src="cazando.js"></script>
</body>
</html>
